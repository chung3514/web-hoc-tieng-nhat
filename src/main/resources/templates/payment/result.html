<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ket qua thanh toan</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f6f8fc;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .result {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #dbe2ef;
      box-shadow: 0 14px 34px rgba(16, 47, 86, 0.12);
      text-align: center;
    }

    .status {
      font-size: 26px;
      margin: 8px 0;
      font-weight: 700;
    }

    .ok { color: #1f9d55; }
    .fail { color: #d9534f; }

    .box {
      margin-top: 16px;
      text-align: left;
      background: #f9fbff;
      border: 1px solid #e3e9f4;
      border-radius: 12px;
      padding: 14px;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      background: #0a7ea4;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="result">
    <p class="status" th:classappend="${success} ? 'ok' : 'fail'" th:text="${success} ? 'Thanh toan thanh cong' : 'Thanh toan that bai'">Thanh toan thanh cong</p>
    <p th:text="${success} ? 'Cam on ban da dang ky khoa hoc.' : 'Vui long thu lai hoac doi phuong thuc thanh toan.'">Cam on ban da dang ky khoa hoc.</p>

    <div class="box">
      <p><strong>Ma don hang:</strong> <span th:text="${orderId}">ORD-1710000000</span></p>
      <p><strong>Thong bao:</strong> <span th:text="${message}">Da tao giao dich MOMO thanh cong.</span></p>
    </div>

    <a href="/payment/checkout">Quay lai trang thanh toan</a>
  </div>
</body>
</html>

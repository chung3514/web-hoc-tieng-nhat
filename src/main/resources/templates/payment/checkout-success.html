<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout Success</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f6f8fc;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .result {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #dbe2ef;
      box-shadow: 0 14px 34px rgba(16, 47, 86, 0.12);
      text-align: center;
    }

    .ok {
      color: #1f9d55;
      font-size: 28px;
      margin: 6px 0 4px;
      font-weight: 700;
    }

    .box {
      margin-top: 16px;
      text-align: left;
      background: #f9fbff;
      border: 1px solid #e3e9f4;
      border-radius: 12px;
      padding: 14px;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      background: #0a7ea4;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="result">
    <p class="ok">Thanh toan thanh cong</p>
    <p>Cam on ban da hoan tat giao dich.</p>

    <div class="box">
      <p><strong>Ma don hang:</strong> <span th:text="${orderId}">ORD-1710000000</span></p>
      <p><strong>Thong bao:</strong> <span th:text="${message}">Giao dich da duoc thanh toan thanh cong.</span></p>
    </div>

    <a href="/payment/checkout">Tao giao dich moi</a>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanh toan khoa hoc</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1f2a44;
      --muted: #6c7891;
      --primary: #0a7ea4;
      --success: #1f9d55;
      --border: #dbe2ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #e8f6fb 0%, var(--bg) 45%);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(16, 47, 86, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    .muted { color: var(--muted); }

    .method {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 15px;
    }

    .amount {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #0a7ea4 0%, #096080 100%);
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.94;
    }

    .ok {
      margin-top: 12px;
      color: var(--success);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      body { padding: 14px; }
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Giao dien thanh toan</h1>
      <p class="muted">Hoan thanh buoc thanh toan cho khoa hoc dang ky.</p>

      <h3>Khoa hoc</h3>
      <p><strong th:text="${courseName}">N5 Full Course</strong></p>

      <h3>Phuong thuc thanh toan</h3>
      <label class="method">
        <input type="radio" name="paymentMethod" value="MOMO" checked />
        <span>Vi MoMo</span>
      </label>
      <label class="method">
        <input type="radio" name="paymentMethod" value="BANK" />
        <span>Chuyen khoan ngan hang</span>
      </label>
      <label class="method">
        <input type="radio" name="paymentMethod" value="CARD" />
        <span>The noi dia / quoc te</span>
      </label>
    </div>

    <div class="card">
      <h3>Tong ket don hang</h3>
      <div class="summary-row">
        <span>Tam tinh</span>
        <strong id="checkout-amount" th:attr="data-amount=${amount}" th:text="${#numbers.formatInteger(amount,0,'COMMA')} + 'd'">1,299,000d</strong>
      </div>

      <div th:replace="fragments/voucher-box :: *"></div>

      <div class="summary-row" style="margin-top: 16px;">
        <span>Thanh toan</span>
        <span class="amount" id="payable-amount" th:text="${#numbers.formatInteger(amount,0,'COMMA')} + 'd'">1,299,000d</span>
      </div>

      <button type="button" onclick="submitPayment()">Xac nhan thanh toan</button>
      <p class="ok" id="result-note"></p>
    </div>
  </div>

  <script>
    function submitPayment() {
      const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked');
      const amountNode = document.getElementById('checkout-amount');
      const note = document.getElementById('result-note');
      const amount = Number((amountNode && amountNode.dataset.amount) || 0);
      const method = selectedMethod ? selectedMethod.value : 'MOMO';

      const orderId = 'ORD-' + Date.now();
      const msg = 'Da tao giao dich ' + method + ' thanh cong. So tien: ' + amount.toLocaleString('vi-VN') + 'd';
      note.textContent = msg;

      window.setTimeout(() => {
        let url = '/payment/checkout-qr?orderId=' + encodeURIComponent(orderId)
          + '&method=' + encodeURIComponent(method)
          + '&amount=' + encodeURIComponent(String(amount));
        if (method !== 'MOMO') {
          url = '/payment/checkout-success?orderId=' + encodeURIComponent(orderId)
            + '&message=' + encodeURIComponent(msg);
        }
        window.location.href = url;
      }, 500);
    }

    (function syncPayableAmount() {
      const amountNode = document.getElementById('checkout-amount');
      const payableNode = document.getElementById('payable-amount');
      if (!amountNode || !payableNode) {
        return;
      }
      const observer = new MutationObserver(() => {
        payableNode.textContent = amountNode.textContent;
      });
      observer.observe(amountNode, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>

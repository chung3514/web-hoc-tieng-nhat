<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout QR</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #1f2a44;
      --muted: #6c7891;
      --primary: #0a7ea4;
      --border: #dbe2ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #e8f6fb 0%, var(--bg) 45%);
      display: grid;
      place-items: center;
    }

    .wrap {
      width: min(760px, 100%);
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(16, 47, 86, 0.1);
    }

    .qr {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border-radius: 14px;
      border: 1px solid var(--border);
      background:
        linear-gradient(90deg, #111 12px, transparent 0) 0 0 / 24px 24px,
        linear-gradient(#111 12px, transparent 0) 0 0 / 24px 24px,
        #fff;
    }

    .label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .value {
      font-weight: 600;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #0a7ea4 0%, #096080 100%);
    }

    .btn-light {
      color: var(--text);
      background: #eef3fb;
    }

    @media (max-width: 820px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Quet ma QR de thanh toan</h2>
      <p class="label">Phuong thuc</p>
      <p class="value" th:text="${method}">MOMO</p>

      <p class="label">Ma don hang</p>
      <p class="value" th:text="${orderId}">ORD-1710000000</p>

      <p class="label">So tien</p>
      <p class="value" th:text="${#numbers.formatInteger(amount,0,'COMMA')} + 'd'">1,299,000d</p>

      <div class="actions">
        <a class="btn btn-light" href="/payment/checkout">Quay lai checkout</a>
      </div>
    </div>

    <div class="card" style="text-align:center;">
      <div class="qr" aria-label="QR demo"></div>
      <p style="margin:14px 0 0; color: var(--muted);">Demo QR. Sau khi nguoi dung thanh toan, bam nut ben duoi.</p>

      <div class="actions" style="justify-content:center; margin-top: 16px;">
        <button class="btn btn-primary" type="button" onclick="goSuccess()">Toi trang thanh cong</button>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    function goSuccess() {
      const orderId = /*[[${orderId}]]*/ 'ORD-1710000000';
      const message = 'Thanh toan bang QR thanh cong';
      const url = '/payment/checkout-success?orderId=' + encodeURIComponent(orderId) + '&message=' + encodeURIComponent(message);
      window.location.href = url;
    }
  </script>
</body>
</html>

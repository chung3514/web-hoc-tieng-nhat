<div class="voucher-box">
  <label for="voucher-code">Voucher code</label>
  <div class="voucher-row">
    <input id="voucher-code" type="text" placeholder="Enter code, e.g. WELCOME20" />
    <button type="button" onclick="applyVoucherCode()">Apply</button>
  </div>
  <p id="voucher-message" style="margin-top:8px;font-size:13px;"></p>
</div>

<script>
  function applyVoucherCode() {
    const codeInput = document.getElementById('voucher-code');
    const msg = document.getElementById('voucher-message');
    const amountNode = document.getElementById('checkout-amount');

    const code = (codeInput && codeInput.value || '').trim();
    const amount = Number((amountNode && amountNode.dataset.amount) || 0);

    if (!code) {
      msg.textContent = 'Please enter a voucher code.';
      msg.style.color = '#d9534f';
      return;
    }

    fetch('/api/voucher/apply?code=' + encodeURIComponent(code) + '&amount=' + amount)
      .then(r => r.json())
      .then(data => {
        if (!data.success) {
          msg.textContent = data.message || 'Invalid voucher code.';
          msg.style.color = '#d9534f';
          return;
        }

        msg.textContent = 'Applied ' + data.discount + '% discount. Saved: ' + data.saved;
        msg.style.color = '#2e8b57';
        if (amountNode) {
          amountNode.dataset.amount = data.data;
          amountNode.textContent = Number(data.data).toLocaleString('vi-VN') + 'd';
        }
      })
      .catch(() => {
        msg.textContent = 'Cannot apply voucher right now.';
        msg.style.color = '#d9534f';
      });
  }
</script>
